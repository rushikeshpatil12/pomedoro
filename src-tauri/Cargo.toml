[package]
name = "pomedoro"
version = "0.1.0"
description = "A fast, minimal Pomodoro timer that docks to a corner of your screen"
license = "MIT"
edition = "2021"

[lib]
name = "pomedoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Per-user (HKEY_CURRENT_USER) registry access for the system proxy setting -
# no admin rights needed, unlike the machine-wide hosts file.
winreg = "0.55"
# Only used to tell already-running apps to re-read the proxy settings
# (InternetSetOptionW) after we change them.
windows = { version = "0.61", features = ["Win32_Networking_WinInet"] }

# Keep the shipped binary small and fast to start - this app should idle at
# near-zero CPU/RAM since it just sits in a corner counting down.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
